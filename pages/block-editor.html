<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NBT Block ID Editor</title>

    <link rel="stylesheet" href="../style/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
            href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap"
            rel="stylesheet"
    >

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
</head>

<body>

<div class="wrap">

    <header class="app-header">
        <div class="brand">
            <div class="brand-mark"></div>

            <div>
                <h1>NBT Block ID Editor</h1>
            </div>
        </div>
    </header>

    <div id="status"></div>

    <div id="dropzone">

        <div class="icon">
            <svg viewBox="0 0 52 52" fill="none">
                <rect
                        x="10"
                        y="10"
                        width="32"
                        height="32"
                        rx="2"
                        fill="#765a36"
                        opacity="0.5"
                />

                <path
                        d="M26 13v19"
                        stroke="#d39a52"
                        stroke-width="2"
                />

                <path
                        d="M19 25l7 7 7-7"
                        stroke="#d39a52"
                        stroke-width="2"
                        fill="none"
                />
            </svg>
        </div>

        <h2>Drop a .nbt structure file here</h2>

        <p>
            Parsing and editing are performed locally in your browser.
        </p>

        <button class="browse-btn" id="browse-btn">
            Choose file…
        </button>

        <input type="file" id="file-input" accept=".nbt">

    </div>

    <div id="workspace">

        <div class="file-bar">

            <div>
                <div class="fname" id="fname">—</div>
                <div class="fmeta" id="fmeta">—</div>
            </div>

            <div class="actions">
                <button class="btn ghost small" id="load-other-btn">
                    Load different file
                </button>

                <button class="btn primary" id="download-btn" disabled>
                    Download edited .nbt
                </button>
            </div>

        </div>

        <div class="toolbar">

            <input
                    type="text"
                    id="search"
                    placeholder="Filter block IDs…"
            >

            <div class="sort-toggle">
                <button data-sort="count" class="active">count</button>
                <button data-sort="name">a–z</button>
            </div>

        </div>

        <div id="block-table"></div>

        <div id="empty-search" style="display:none;">
            No block IDs match that filter.
        </div>

        <div id="changelog-wrap" style="display:none;">
            <h3>Renames applied this session</h3>
            <div id="changelog"></div>
        </div>

    </div>

</div>

<script>
    (function(){
        "use strict";

        const TAG = {
            End: 0,
            Byte: 1,
            Short: 2,
            Int: 3,
            Long: 4,
            Float: 5,
            Double: 6,
            ByteArray: 7,
            String: 8,
            List: 9,
            Compound: 10,
            IntArray: 11,
            LongArray: 12
        };

        class NbtReader {
            constructor(buf) {
                this.dv = new DataView(
                    buf.buffer,
                    buf.byteOffset,
                    buf.byteLength
                );

                this.bytes = buf;
                this.off = 0;
            }

            byte() {
                const v = this.dv.getInt8(this.off);
                this.off += 1;
                return v;
            }

            ubyte() {
                const v = this.dv.getUint8(this.off);
                this.off += 1;
                return v;
            }

            short() {
                const v = this.dv.getInt16(this.off);
                this.off += 2;
                return v;
            }

            ushort() {
                const v = this.dv.getUint16(this.off);
                this.off += 2;
                return v;
            }

            int() {
                const v = this.dv.getInt32(this.off);
                this.off += 4;
                return v;
            }

            long() {
                const v = this.dv.getBigInt64(this.off);
                this.off += 8;
                return v;
            }

            float() {
                const v = this.dv.getFloat32(this.off);
                this.off += 4;
                return v;
            }

            double() {
                const v = this.dv.getFloat64(this.off);
                this.off += 8;
                return v;
            }

            bytes_(n) {
                const v = this.bytes.slice(
                    this.off,
                    this.off + n
                );

                this.off += n;
                return v;
            }

            string() {
                const len = this.ushort();
                const b = this.bytes_(len);

                return new TextDecoder("utf-8").decode(b);
            }

            payload(type) {
                switch(type) {

                    case TAG.Byte:
                        return {
                            type,
                            value: this.byte()
                        };

                    case TAG.Short:
                        return {
                            type,
                            value: this.short()
                        };

                    case TAG.Int:
                        return {
                            type,
                            value: this.int()
                        };

                    case TAG.Long:
                        return {
                            type,
                            value: this.long()
                        };

                    case TAG.Float:
                        return {
                            type,
                            value: this.float()
                        };

                    case TAG.Double:
                        return {
                            type,
                            value: this.double()
                        };

                    case TAG.ByteArray: {
                        const len = this.int();
                        const arr = new Int8Array(len);

                        for(let i = 0; i < len; i++) {
                            arr[i] = this.byte();
                        }

                        return {
                            type,
                            value: arr
                        };
                    }

                    case TAG.String:
                        return {
                            type,
                            value: this.string()
                        };

                    case TAG.List: {
                        const elemType = this.ubyte();
                        const len = this.int();
                        const items = [];

                        for(let i = 0; i < len; i++) {
                            items.push(
                                this.payload(elemType)
                            );
                        }

                        return {
                            type,
                            elemType,
                            value: items
                        };
                    }

                    case TAG.Compound: {
                        const entries = [];

                        while(true) {
                            const t = this.ubyte();

                            if(t === TAG.End)
                                break;

                            const name = this.string();
                            const val = this.payload(t);

                            entries.push({
                                name,
                                tag: val
                            });
                        }

                        return {
                            type,
                            value: entries
                        };
                    }

                    case TAG.IntArray: {
                        const len = this.int();
                        const arr = new Int32Array(len);

                        for(let i = 0; i < len; i++) {
                            arr[i] = this.int();
                        }

                        return {
                            type,
                            value: arr
                        };
                    }

                    case TAG.LongArray: {
                        const len = this.int();
                        const arr = new BigInt64Array(len);

                        for(let i = 0; i < len; i++) {
                            arr[i] = this.long();
                        }

                        return {
                            type,
                            value: arr
                        };
                    }

                    default:
                        throw new Error(
                            "Unknown NBT tag type " + type
                        );
                }
            }

            readRoot() {
                const t = this.ubyte();

                if(t !== TAG.Compound) {
                    throw new Error(
                        "Root tag is not a Compound (got type " +
                        t +
                        ") — this may not be a structure NBT file."
                    );
                }

                const name = this.string();
                const value = this.payload(TAG.Compound);

                return {
                    name,
                    root: value
                };
            }
        }

        class NbtWriter {
            constructor() {
                this.chunks = [];
                this.len = 0;
            }

            push(u8) {
                this.chunks.push(u8);
                this.len += u8.length;
            }

            pushView(size, fn) {
                const buf = new ArrayBuffer(size);
                fn(new DataView(buf));
                this.push(new Uint8Array(buf));
            }

            byte(v) {
                this.pushView(
                    1,
                    dv => dv.setInt8(0, v)
                );
            }

            ubyte(v) {
                this.pushView(
                    1,
                    dv => dv.setUint8(0, v)
                );
            }

            short(v) {
                this.pushView(
                    2,
                    dv => dv.setInt16(0, v)
                );
            }

            ushort(v) {
                this.pushView(
                    2,
                    dv => dv.setUint16(0, v)
                );
            }

            int(v) {
                this.pushView(
                    4,
                    dv => dv.setInt32(0, v)
                );
            }

            long(v) {
                this.pushView(
                    8,
                    dv => dv.setBigInt64(0, v)
                );
            }

            float(v) {
                this.pushView(
                    4,
                    dv => dv.setFloat32(0, v)
                );
            }

            double(v) {
                this.pushView(
                    8,
                    dv => dv.setFloat64(0, v)
                );
            }

            string(s) {
                const enc = new TextEncoder().encode(s);

                this.ushort(enc.length);
                this.push(enc);
            }

            payload(node) {

                const {
                    type,
                    value
                } = node;

                switch(type) {

                    case TAG.Byte:
                        this.byte(value);
                        break;

                    case TAG.Short:
                        this.short(value);
                        break;

                    case TAG.Int:
                        this.int(value);
                        break;

                    case TAG.Long:
                        this.long(value);
                        break;

                    case TAG.Float:
                        this.float(value);
                        break;

                    case TAG.Double:
                        this.double(value);
                        break;

                    case TAG.ByteArray:
                        this.int(value.length);

                        for(let i = 0; i < value.length; i++) {
                            this.byte(value[i]);
                        }

                        break;

                    case TAG.String:
                        this.string(value);
                        break;

                    case TAG.List: {
                        this.ubyte(node.elemType);
                        this.int(value.length);

                        for(const item of value) {
                            this.payload(item);
                        }

                        break;
                    }

                    case TAG.Compound: {
                        for(const entry of value) {
                            this.ubyte(entry.tag.type);
                            this.string(entry.name);
                            this.payload(entry.tag);
                        }

                        this.ubyte(TAG.End);
                        break;
                    }

                    case TAG.IntArray:
                        this.int(value.length);

                        for(let i = 0; i < value.length; i++) {
                            this.int(value[i]);
                        }

                        break;

                    case TAG.LongArray:
                        this.int(value.length);

                        for(let i = 0; i < value.length; i++) {
                            this.long(value[i]);
                        }

                        break;

                    default:
                        throw new Error(
                            "Unknown NBT tag type on write " +
                            type
                        );
                }
            }

            writeRoot(name, rootTag) {
                this.ubyte(TAG.Compound);
                this.string(name);
                this.payload(rootTag);
            }

            toBytes() {
                const out = new Uint8Array(this.len);

                let o = 0;

                for(const c of this.chunks) {
                    out.set(c, o);
                    o += c.length;
                }

                return out;
            }
        }

        function compoundGet(compoundTag, name) {
            return compoundTag.value.find(
                e => e.name === name
            );
        }

        function collectPaletteLists(rootCompound) {

            const lists = [];

            const pal = compoundGet(
                rootCompound,
                "palette"
            );

            if(
                pal &&
                pal.tag.type === TAG.List
            ) {
                lists.push(pal.tag);
            }

            const pals = compoundGet(
                rootCompound,
                "palettes"
            );

            if(
                pals &&
                pals.tag.type === TAG.List
            ) {

                for(const sub of pals.tag.value) {

                    if(sub.type === TAG.List) {
                        lists.push(sub);
                    }
                }
            }

            return lists;
        }

        function getPaletteEntryName(
            paletteCompoundEntry
        ) {

            const nameEntry =
                compoundGet(
                    paletteCompoundEntry,
                    "Name"
                );

            return nameEntry
                ? nameEntry.tag.value
                : null;
        }

        function analyze(rootCompound) {

            const paletteLists =
                collectPaletteLists(rootCompound);

            if(paletteLists.length === 0) {
                throw new Error(
                    "No 'palette' tag found — " +
                    "this doesn't look like a vanilla structure NBT file."
                );
            }

            const primary = paletteLists[0];

            const indexToName =
                primary.value.map(
                    getPaletteEntryName
                );

            const counts = new Map();

            const blocksEntry =
                compoundGet(
                    rootCompound,
                    "blocks"
                );

            if(
                blocksEntry &&
                blocksEntry.tag.type === TAG.List
            ) {

                for(
                    const blockCompound
                    of blocksEntry.tag.value
                    ) {

                    const stateEntry =
                        compoundGet(
                            blockCompound,
                            "state"
                        );

                    if(!stateEntry)
                        continue;

                    const idx =
                        stateEntry.tag.value;

                    const name =
                        indexToName[idx];

                    if(name != null) {

                        counts.set(
                            name,
                            (counts.get(name) || 0) + 1
                        );
                    }
                }
            }

            const allNames =
                new Set(indexToName);

            for(
                const list
                of paletteLists
                ) {

                for(
                    const entry
                    of list.value
                    ) {

                    allNames.add(
                        getPaletteEntryName(entry)
                    );
                }
            }

            const rows = [];

            for(const name of allNames) {

                if(name == null)
                    continue;

                rows.push({
                    name,
                    count: counts.get(name) || 0
                });
            }

            rows.sort(
                (a, b) =>
                    b.count - a.count ||
                    a.name.localeCompare(b.name)
            );

            return rows;
        }

        function renameBlock(
            rootCompound,
            oldName,
            newName
        ) {

            const paletteLists =
                collectPaletteLists(rootCompound);

            let changed = 0;

            for(
                const list
                of paletteLists
                ) {

                for(
                    const entry
                    of list.value
                    ) {

                    const nameEntry =
                        compoundGet(
                            entry,
                            "Name"
                        );

                    if(
                        nameEntry &&
                        nameEntry.tag.value === oldName
                    ) {

                        nameEntry.tag.value =
                            newName;

                        changed++;
                    }
                }
            }

            return changed;
        }

        let state = {
            fileName: null,
            rootName: "",
            rootCompound: null,
            rows: [],
            changeLog: [],
            sortMode: "count",
            filter: "",
            editingRow: null
        };

        const el = {

            dropzone:
                document.getElementById("dropzone"),

            fileInput:
                document.getElementById("file-input"),

            browseBtn:
                document.getElementById("browse-btn"),

            status:
                document.getElementById("status"),

            workspace:
                document.getElementById("workspace"),

            fname:
                document.getElementById("fname"),

            fmeta:
                document.getElementById("fmeta"),

            loadOtherBtn:
                document.getElementById("load-other-btn"),

            downloadBtn:
                document.getElementById("download-btn"),

            search:
                document.getElementById("search"),

            blockTable:
                document.getElementById("block-table"),

            emptySearch:
                document.getElementById("empty-search"),

            changelogWrap:
                document.getElementById("changelog-wrap"),

            changelog:
                document.getElementById("changelog"),

            sortButtons:
                document.querySelectorAll(
                    ".sort-toggle button"
                )
        };

        function showStatus(msg, kind) {

            el.status.textContent = msg;

            el.status.className =
                "show " + (kind || "info");
        }

        function clearStatus() {
            el.status.className = "";
        }

        function swatchColor(name) {

            let h = 0;

            for(let i = 0; i < name.length; i++) {
                h =
                    (h * 31 +
                        name.charCodeAt(i)) >>> 0;
            }

            const hue = h % 360;
            const sat = 42 + (h % 20);
            const light = 38 + (h % 14);

            return `
      hsl(
        ${hue}
        ${sat}%
        ${light}%
      )
    `;
        }

        function splitNs(name) {

            const i = name.indexOf(":");

            if(i === -1) {
                return {
                    ns: null,
                    path: name
                };
            }

            return {
                ns: name.slice(0, i),
                path: name.slice(i + 1)
            };
        }

        async function loadFile(file) {

            clearStatus();

            showStatus(
                "Reading " + file.name + "…",
                "info"
            );

            try {

                const buf =
                    new Uint8Array(
                        await file.arrayBuffer()
                    );

                let raw;

                if(
                    buf.length >= 2 &&
                    buf[0] === 0x1f &&
                    buf[1] === 0x8b
                ) {

                    raw = pako.inflate(buf);

                } else {

                    raw = buf;
                }

                const reader =
                    new NbtReader(raw);

                const {
                    name,
                    root
                } = reader.readRoot();

                const rows =
                    analyze(root);

                state.fileName = file.name;
                state.rootName = name;
                state.rootCompound = root;
                state.rows = rows;
                state.changeLog = [];
                state.editingRow = null;

                el.fname.textContent =
                    file.name;

                el.fmeta.textContent =
                    rows.length +
                    " unique block ID" +
                    (rows.length === 1 ? "" : "s") +
                    " found";

                el.dropzone.style.display =
                    "none";

                el.workspace.classList.add(
                    "show"
                );

                el.downloadBtn.disabled = true;

                el.changelogWrap.style.display =
                    "none";

                showStatus(
                    "Loaded " +
                    file.name +
                    " — " +
                    rows.length +
                    " unique block ID" +
                    (rows.length === 1 ? "" : "s") +
                    ".",
                    "success"
                );

                render();

            } catch(err) {

                console.error(err);

                showStatus(
                    "Couldn't parse this file: " +
                    err.message,
                    "error"
                );
            }
        }

        function currentFilteredRows() {

            let rows =
                state.rows.slice();

            if(state.sortMode === "name") {

                rows.sort(
                    (a, b) =>
                        a.name.localeCompare(
                            b.name
                        )
                );

            } else {

                rows.sort(
                    (a, b) =>
                        b.count - a.count ||
                        a.name.localeCompare(
                            b.name
                        )
                );
            }

            const f =
                state.filter
                    .trim()
                    .toLowerCase();

            if(f) {
                rows =
                    rows.filter(
                        r =>
                            r.name
                                .toLowerCase()
                                .includes(f)
                    );
            }

            return rows;
        }

        function escapeHtml(s) {

            return s
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");
        }

        function render() {

            const rows =
                currentFilteredRows();

            el.blockTable.innerHTML = "";

            el.emptySearch.style.display =
                rows.length
                    ? "none"
                    : "block";

            for(const row of rows) {

                const rowEl =
                    document.createElement("div");

                rowEl.className = "row";

                const wasChanged =
                    state.changeLog.some(
                        c => c.to === row.name
                    );

                if(wasChanged) {
                    rowEl.classList.add(
                        "changed"
                    );
                }

                const swatch =
                    document.createElement("div");

                swatch.className =
                    "swatch";

                swatch.style.background =
                    swatchColor(row.name);

                rowEl.appendChild(
                    swatch
                );

                const main =
                    document.createElement("div");

                main.className =
                    "row-main";

                if(
                    state.editingRow ===
                    row.name
                ) {

                    const input =
                        document.createElement(
                            "input"
                        );

                    input.className =
                        "rename-input";

                    input.value =
                        row.name;

                    main.appendChild(input);
                    rowEl.appendChild(main);

                    const editActions =
                        document.createElement(
                            "div"
                        );

                    editActions.className =
                        "row-edit-actions";

                    const confirmBtn =
                        document.createElement(
                            "button"
                        );

                    confirmBtn.className =
                        "btn small primary";

                    confirmBtn.textContent =
                        "Apply";

                    const cancelBtn =
                        document.createElement(
                            "button"
                        );

                    cancelBtn.className =
                        "btn small ghost";

                    cancelBtn.textContent =
                        "Cancel";

                    editActions.appendChild(
                        confirmBtn
                    );

                    editActions.appendChild(
                        cancelBtn
                    );

                    rowEl.appendChild(
                        editActions
                    );

                    const commit = () => {

                        const newName =
                            input.value.trim();

                        if(
                            !newName ||
                            newName === row.name
                        ) {

                            state.editingRow = null;
                            render();

                            return;
                        }

                        applyRename(
                            row.name,
                            newName
                        );
                    };

                    confirmBtn.addEventListener(
                        "click",
                        commit
                    );

                    input.addEventListener(
                        "keydown",
                        e => {

                            if(e.key === "Enter")
                                commit();

                            if(e.key === "Escape") {
                                state.editingRow = null;
                                render();
                            }
                        }
                    );

                    cancelBtn.addEventListener(
                        "click",
                        () => {
                            state.editingRow = null;
                            render();
                        }
                    );

                    setTimeout(() => {
                        input.focus();
                        input.select();
                    }, 0);

                } else {

                    const nameDiv =
                        document.createElement(
                            "div"
                        );

                    nameDiv.className =
                        "block-name";

                    const {
                        ns,
                        path
                    } = splitNs(row.name);

                    nameDiv.innerHTML = ns
                        ? `<span class="ns">${escapeHtml(ns)}:</span>${escapeHtml(path)}`
                        : escapeHtml(row.name);

                    main.appendChild(
                        nameDiv
                    );

                    rowEl.appendChild(
                        main
                    );

                    const count =
                        document.createElement(
                            "div"
                        );

                    count.className =
                        "count";

                    count.textContent =
                        row.count;

                    rowEl.appendChild(
                        count
                    );

                    const renameBtn =
                        document.createElement(
                            "button"
                        );

                    renameBtn.className =
                        "btn small";

                    renameBtn.textContent =
                        "Rename";

                    renameBtn.addEventListener(
                        "click",
                        () => {
                            state.editingRow =
                                row.name;

                            render();
                        }
                    );

                    rowEl.appendChild(
                        renameBtn
                    );
                }

                el.blockTable.appendChild(
                    rowEl
                );
            }
        }

        function applyRename(
            oldName,
            newName
        ) {

            const changed =
                renameBlock(
                    state.rootCompound,
                    oldName,
                    newName
                );

            if(changed === 0) {

                showStatus(
                    "Couldn't find any palette entries for " +
                    oldName,
                    "error"
                );

                state.editingRow = null;
                render();

                return;
            }

            state.rows =
                analyze(
                    state.rootCompound
                );

            state.changeLog.push({
                from: oldName,
                to: newName
            });

            state.editingRow = null;

            el.downloadBtn.disabled =
                false;

            renderChangelog();

            showStatus(
                "Renamed " +
                oldName +
                " → " +
                newName,
                "success"
            );

            render();
        }

        function renderChangelog() {

            if(
                state.changeLog.length === 0
            ) {

                el.changelogWrap.style.display =
                    "none";

                return;
            }

            el.changelogWrap.style.display =
                "block";

            el.changelog.innerHTML = "";

            state.changeLog.forEach(
                (c, idx) => {

                    const item =
                        document.createElement(
                            "div"
                        );

                    item.className =
                        "change-item";

                    item.innerHTML =
                        `<span>${escapeHtml(c.from)}</span>` +
                        `<span class="arrow">→</span>` +
                        `<span class="to">${escapeHtml(c.to)}</span>`;

                    const undo =
                        document.createElement(
                            "button"
                        );

                    undo.className =
                        "undo";

                    undo.textContent =
                        "undo";

                    undo.addEventListener(
                        "click",
                        () => {

                            renameBlock(
                                state.rootCompound,
                                c.to,
                                c.from
                            );

                            state.changeLog.splice(
                                idx,
                                1
                            );

                            state.rows =
                                analyze(
                                    state.rootCompound
                                );

                            el.downloadBtn.disabled =
                                state.changeLog.length === 0;

                            renderChangelog();

                            showStatus(
                                "Reverted " +
                                c.to +
                                " → " +
                                c.from,
                                "info"
                            );

                            render();
                        }
                    );

                    item.appendChild(
                        undo
                    );

                    el.changelog.appendChild(
                        item
                    );
                }
            );
        }

        function downloadEdited() {

            try {

                const writer =
                    new NbtWriter();

                writer.writeRoot(
                    state.rootName,
                    state.rootCompound
                );

                const rawBytes =
                    writer.toBytes();

                const gz =
                    pako.gzip(rawBytes);

                const base =
                    state.fileName.replace(
                        /\.nbt$/i,
                        ""
                    );

                const outName =
                    base + "_edited.nbt";

                const blob =
                    new Blob(
                        [gz],
                        {
                            type:
                                "application/octet-stream"
                        }
                    );

                const url =
                    URL.createObjectURL(
                        blob
                    );

                const a =
                    document.createElement(
                        "a"
                    );

                a.href = url;
                a.download = outName;

                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);

                URL.revokeObjectURL(url);

                showStatus(
                    "Downloaded " +
                    outName,
                    "success"
                );

            } catch(err) {

                console.error(err);

                showStatus(
                    "Failed to export: " +
                    err.message,
                    "error"
                );
            }
        }

        function resetToDropzone() {

            state = {
                fileName: null,
                rootName: "",
                rootCompound: null,
                rows: [],
                changeLog: [],
                sortMode: "count",
                filter: "",
                editingRow: null
            };

            el.workspace.classList.remove(
                "show"
            );

            el.dropzone.style.display =
                "block";

            el.search.value = "";

            clearStatus();

            el.fileInput.value = "";
        }

        el.browseBtn.addEventListener(
            "click",
            () =>
                el.fileInput.click()
        );

        el.dropzone.addEventListener(
            "click",
            e => {

                if(
                    e.target ===
                    el.browseBtn
                ) {
                    return;
                }

                el.fileInput.click();
            }
        );

        el.fileInput.addEventListener(
            "change",
            e => {

                if(
                    e.target.files &&
                    e.target.files[0]
                ) {

                    loadFile(
                        e.target.files[0]
                    );
                }
            }
        );

        ["dragenter", "dragover"]
            .forEach(evt => {

                el.dropzone.addEventListener(
                    evt,
                    e => {

                        e.preventDefault();
                        e.stopPropagation();

                        el.dropzone.classList.add(
                            "drag"
                        );
                    }
                );
            });

        ["dragleave", "drop"]
            .forEach(evt => {

                el.dropzone.addEventListener(
                    evt,
                    e => {

                        e.preventDefault();
                        e.stopPropagation();

                        el.dropzone.classList.remove(
                            "drag"
                        );
                    }
                );
            });

        el.dropzone.addEventListener(
            "drop",
            e => {

                const file =
                    e.dataTransfer.files &&
                    e.dataTransfer.files[0];

                if(file) {
                    loadFile(file);
                }
            }
        );

        el.loadOtherBtn.addEventListener(
            "click",
            resetToDropzone
        );

        el.downloadBtn.addEventListener(
            "click",
            downloadEdited
        );

        el.search.addEventListener(
            "input",
            e => {

                state.filter =
                    e.target.value;

                render();
            }
        );

        el.sortButtons.forEach(
            btn => {

                btn.addEventListener(
                    "click",
                    () => {

                        el.sortButtons.forEach(
                            b =>
                                b.classList.remove(
                                    "active"
                                )
                        );

                        btn.classList.add(
                            "active"
                        );

                        state.sortMode =
                            btn.dataset.sort;

                        render();
                    }
                );
            }
        );

    })();
</script>

</body>
</html>
